<!doctype html>
<html lang="en">

<head>
    <title>Minimal Websocket Repro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/readability/0.5.0/Readability.min.js" integrity="sha512-XZ0uNdz5h40R7SJavnsSp/TnGvu6WY+U8Q75gZx6orlKCIzutPOd4g+m/zcq7HA1XL8bAQtYLs1zhoCDb4L9sA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="parseRaindropHtml.js"></script>
</head>

<body>
    <p>
        This test will connect to websocket server hosted by the deployed cf worker defined by index.ts.
        Click the button upload the html file to start the test. Eventually browser websocket client with receive a 1006 error.
    </p>

    <button id="file-button">Click to upload</button>
</body>

<script>
    const url = new URL("https://cf-limit-repro.storeader.workers.dev");
    url.protocol = "wss";
    url.pathname = "/ws";

    this.ws = new WebSocket(url);
    if (!this.ws) {
        throw new Error("server didn't accept ws");
    }

    this.ws.addEventListener("open", () => {
        console.log("Opened websocket");
    });
    this.ws.addEventListener("message", ({ data }) => {
        const res = JSON.parse(data);
        console.log(res)
    });
    this.ws.addEventListener("close", () => {
        console.log("Closed websocket");
    });

    document.getElementById('file-button').addEventListener('click', function () {
        // Create a file input element
        const fileInput = document.createElement('input');
        fileInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            console.log(file)
            const reader = new FileReader();
            reader.readAsText(file, "UTF-8");
            reader.onload = function (event) {
                const fileContent = event.target.result;
                const urls = parsePocketHtml(fileContent)
                urls.forEach(url => {
                    console.log(`Sending url: ${url}`)
                    ws.send(JSON.stringify({ url }))
                });
            };
        });
        fileInput.type = 'file';
        fileInput.accept = '.html';
        fileInput.click();
    });

</script>

</html>
