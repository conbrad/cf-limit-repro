name = "cf-limit-repro"
main = "src/index.ts"
compatibility_date = "2024-05-02"

[[queues.producers]]
 queue = "test-queue"
 binding = "test_queue_binding"

[[queues.consumers]]
  queue = "test-queue"
  max_batch_size = 1
  max_batch_timeout = 30
  max_retries = 10
  dead_letter_queue = "test-queue-dlq"

[[durable_objects.bindings]]
  name = "websocket_server"
  class_name = "WebsocketServer"

[[migrations]]
  tag = "v1"
  new_classes = ["WebsocketServer"]